[project]
name = "fmi-image-processor"
version = "0.1.0"
description = "OpenCV multi-face embedding service for FMI galleries"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "numpy>=2.2,<3",
    "opencv-python-headless==4.14.0.94",
    "pydantic-settings==2.15.0",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.39,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
